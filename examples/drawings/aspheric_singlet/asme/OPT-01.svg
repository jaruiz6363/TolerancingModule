<text x="152" y="20" font-family="Helvetica, Arial, sans-serif" font-size="3.482" text-anchor="start" font-weight="bold">NOTES:</text>
<text x="152" y="26" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">1.</text>
<text x="158" y="26" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">INTERPRET DRAWING PER ASME Y14.18 AND ASME Y14.5. DIMENSIONS</text>
<text x="158" y="29.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">IN MILLIMETERS.</text>
<text x="152" y="34" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">2.</text>
<text x="158" y="34" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">MATERIAL: N-BK7 (SCHOTT) OR EQUIVALENT, nd = 1.51680 ± 0.0010, vd =</text>
<text x="158" y="37.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">64.17 ± 0.8%.</text>
<text x="152" y="42" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">3.</text>
<text x="158" y="42" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">POWER AND IRREGULARITY IN FRINGES AT 632.8 NM OVER THE CLEAR</text>
<text x="158" y="45.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">APERTURE.</text>
<text x="152" y="50" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">4.</text>
<text x="158" y="50" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">SURFACE QUALITY 60-40 PER MIL-PRF-13830B OVER THE CLEAR</text>
<text x="158" y="53.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">APERTURE.</text>
<text x="152" y="58" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">5.</text>
<text x="158" y="58" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">WEDGE: EDGE THICKNESS DIFFERENCE 0.0257 MAX (BEAM DEVIATION</text>
<text x="158" y="61.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">3.51&apos; MAX). SURFACE TILT AS TABLE, REFERRED TO DATUM AXIS OF THE</text>
<text x="158" y="65.2" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">OUTSIDE DIAMETER.</text>
<text x="152" y="69.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">6.</text>
<text x="158" y="69.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">PROTECTIVE BEVEL 0.3-0.6 FACE WIDTH X 45°.</text>
<text x="152" y="74" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">7.</text>
<text x="158" y="74" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">COATING: SURFACE 1 NONE; SURFACE 2 NONE.</text>
<text x="152" y="78.4" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">8.</text>
<text x="158" y="78.4" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">EDGE THICKNESS 3.07 REF.</text>
<text x="152" y="82.8" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">9.</text>
<text x="158" y="82.8" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">SURFACE 1 ASPHERIC: Z = (H²/R)/(1 + √(1 − (1+K)H²/R²)) + Σ A_I H^I, K =</text>
<text x="158" y="86.4" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">-0.550000 ±0.005, A4 = -1.2E-06.</text>
<text x="152" y="90.8" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">10.</text>
<text x="158" y="90.8" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">SURFACE 1 DECENTER 0.100 MAX TO THE DATUM AXIS.</text>
<text x="152" y="95.2" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">11.</text>
<text x="158" y="95.2" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">SAG TABLES: Z FROM THE VERTEX ALONG THE AXIS, POSITIVE TO THE</text>
<text x="158" y="98.8" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">RIGHT. ±ΔZ AND ±ΔS ARE THE MOST THE SURFACE&apos;S POWER AND</text>
<text x="158" y="102.4" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">IRREGULARITY TOLERANCES MOVE THE SAG AND TILT THE SURFACE</text>
<text x="158" y="106" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">AT THAT HEIGHT.</text>
<text x="152" y="110.4" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">12.</text>
<text x="158" y="110.4" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">SURFACE 1: ROTATIONALLY SYMMETRIC IRREGULARITY 0.5 FR MAX,</text>
<text x="158" y="114" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">PART OF THE IRREGULARITY (ISO 10110-5 C).</text>
<text x="152" y="118.4" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">13.</text>
<text x="158" y="118.4" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">IN ITS MOUNT (ASSEMBLY DRAWING): DECENTER X ±0.2 MM, DECENTER</text>
<text x="158" y="122" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">Y ±0.2 MM, TILT X ±0.2°, TILT Y ±0.2°.</text>
