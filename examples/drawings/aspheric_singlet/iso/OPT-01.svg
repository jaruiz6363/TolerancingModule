<text x="22" y="156.5" font-family="Helvetica, Arial, sans-serif" font-size="2.786" text-anchor="start">Edge thickness 3.07 (reference). 4/ tilt referred to the datum axis of the cylinder.</text>
<text x="22" y="160" font-family="Helvetica, Arial, sans-serif" font-size="2.786" text-anchor="start">Surface 1 aspheric: z = (h²/R)/(1 + √(1 − (1+k)h²/R²)) + Σ A_i h^i, k = -0.550000 ±0.005, A4 = -1.2E-06.</text>
<text x="22" y="163.5" font-family="Helvetica, Arial, sans-serif" font-size="2.786" text-anchor="start">Sag tables: z from the vertex along the axis, positive to the right. ±Δz and ±Δs are the most the surface&apos;s power</text>
<text x="22" y="167" font-family="Helvetica, Arial, sans-serif" font-size="2.786" text-anchor="start">and irregularity tolerances move the sag and tilt the surface at that height.</text>
