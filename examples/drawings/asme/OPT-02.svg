<text x="158" y="26" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">INTERPRET DRAWING PER ASME Y14.18 AND ASME Y14.5. DIMENSIONS</text>
<text x="158" y="29.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">IN MILLIMETERS.</text>
<text x="152" y="34" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">2.</text>
<text x="158" y="34" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">MATERIAL: F2 (SCHOTT) OR EQUIVALENT, nd = 1.62004 ± 0.0010, vd =</text>
<text x="158" y="37.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">36.37 ± 0.8%.</text>
<text x="152" y="42" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">3.</text>
<text x="158" y="42" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">POWER AND IRREGULARITY IN FRINGES AT 632.8 NM OVER THE CLEAR</text>
<text x="158" y="45.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">APERTURE.</text>
<text x="152" y="50" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">4.</text>
<text x="158" y="50" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">SURFACE QUALITY 60-40 PER MIL-PRF-13830B OVER THE CLEAR</text>
<text x="158" y="53.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">APERTURE.</text>
<text x="152" y="58" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">5.</text>
<text x="158" y="58" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">WEDGE: EDGE THICKNESS DIFFERENCE 0.0181 MAX (BEAM DEVIATION</text>
<text x="158" y="61.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">3.51&apos; MAX). SURFACE TILT AS TABLE, REFERRED TO DATUM AXIS OF THE</text>
<text x="158" y="65.2" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">OUTSIDE DIAMETER.</text>
<text x="152" y="69.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">6.</text>
<text x="158" y="69.6" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">PROTECTIVE BEVEL 0.3-0.6 FACE WIDTH X 45°.</text>
<text x="152" y="74" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">7.</text>
<text x="158" y="74" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">COATING: SURFACE 1 NONE; SURFACE 2 NONE.</text>
<text x="152" y="78.4" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">8.</text>
<text x="158" y="78.4" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">EDGE THICKNESS 2.55 REF.</text>
