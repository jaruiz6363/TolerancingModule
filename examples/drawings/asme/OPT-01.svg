<text x="158" y="34" font-family="Helvetica, Arial, sans-serif" font-size="3.064" text-anchor="start">MATERIAL: N-SK16 (SCHOTT) OR EQUIVALENT, nd = 1.62041 ± 0.0010, vd =</text>
